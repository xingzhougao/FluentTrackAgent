[Music]
; 本地音乐库扫描目录（支持相对路径或绝对路径，相对路径基于应用程序/项目根目录）
local_music_dir=qml/music_resource/loadmusic_by_default
; 推荐音乐扫描目录（若该目录不存在或为空，将自动回退使用本地音乐目录）
recommend_music_dir=qml/music_resource/loadmusic_by_default
; 推荐音乐抽取数量
recommend_count=42

[Storage]
; 配置文件与数据持久化目录
config_dir=config
; 歌单保存文件路径
playlists_file=config/playlists.ini
; 收藏歌曲保存文件路径
favorites_file=config/favorites.ini
; 最近播放保存文件路径
recent_tracks_file=config/recent_tracks.ini
